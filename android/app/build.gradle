plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def pubspecFile = rootProject.file("../pubspec.yaml")
def pubspecContent = pubspecFile.getText("UTF-8")
def versionMatch = pubspecContent =~ /(?m)^version:\s*(\d+\.\d+\.\d+)\+(\d+)/
def appVersionName = versionMatch ? versionMatch[0][1] : "1.0.0"
def appVersionCode = versionMatch ? versionMatch[0][2].toInteger() : 1

android {
    namespace "com.tdg.kaggu_xam_xam"

    // Les plugins (audio_service, shared_preferences, etc.) exigent SDK 36
    compileSdk = 36

    // NDK le plus élevé requis par les plugins (jni exige 28.2.13676358)
    // Rétrocompatible avec r26d — pas besoin de réinstaller r26d séparément
    ndkVersion = "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.tdg.kaggu_xam_xam"
        minSdk 24          // Android 7.0+ comme demandé
        targetSdk 36
        versionCode appVersionCode
        versionName appVersionName
        multiDexEnabled true
    }

    signingConfigs {
        release {
            def props = new Properties()
            file("../../android/key.properties").withInputStream { props.load(it) }
            keyAlias        props['keyAlias']
            keyPassword     props['keyPassword']
            storeFile       file(props['storeFile'])
            storePassword   props['storePassword']
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                         'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation 'androidx.multidex:multidex:2.0.1'
}
